name: Generate GIF previews for new clips

on:
  schedule:
    # Every 15 minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: Generate missing GIFs
        id: gen
        run: python3 scripts/generate_gifs.py

      - name: Commit and push new GIFs
        if: steps.gen.outputs.made_any == 'true'
        run: |
          git config user.name "bachata-gif-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gifs/
          git diff --cached --quiet || git commit -m "Auto-generate GIF previews for newly added clips"
          git push
